name: Revisar plazos de torneos

# Corre solo cada hora (Fase 2 - Motor de temporadas), y también se puede
# disparar a mano desde la pestaña "Actions" de GitHub con "Run workflow",
# para probarlo sin esperar a que dé la hora.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  check-deadlines:
    runs-on: ubuntu-latest
    steps:
      - name: Tocar la puerta del backend
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_URL }}/api/cron/check-deadlines" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
