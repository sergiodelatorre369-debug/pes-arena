name: Revisar plazos de torneos

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  check-deadlines:
    runs-on: ubuntu-latest
    steps:
      - name: Tocar la puerta del backend
        run: |
          curl -s -o response.txt -w "HTTP status: %{http_code}\n" -X POST "${{ secrets.BACKEND_URL }}/api/cron/check-deadlines" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
          echo "Respuesta del backend:"
          cat response.txt
</parameter>
